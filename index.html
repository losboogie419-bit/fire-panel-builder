<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fake It Till You Make It</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin:0; background:#0d0618; color:#fff; font-family:system-ui,sans-serif; overflow:hidden; touch-action:none; }
    #game { display:block; width:100vw; height:100vh; }
    #hud { position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; font-size:14px; background:rgba(20,10,38,0.85); padding:6px 10px; border-radius:8px; }
    #info { position:absolute; bottom:70px; left:8px; right:8px; background:rgba(20,10,38,0.9); padding:8px; border-radius:8px; font-size:13px; max-height:80px; overflow:auto; }
    #controls { position:absolute; bottom:8px; left:0; right:0; display:flex; justify-content:center; gap:8px; }
    button { background:#38E1F5; color:#140A26; border:none; padding:12px 18px; border-radius:8px; font-weight:bold; min-width:64px; }
    button.secondary { background:#7A6A99; color:#fff; }
    #store-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:10; }
    #store-box { background:#24143F; margin:30px auto; padding:16px; max-width:340px; border-radius:12px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div>Stress: <span id="stress">0</span></div>
    <div>Credits: <span id="credits">0</span></div>
  </div>
  <div id="info">Walk to a panel and press Interact.</div>
  <div id="controls">
    <button id="btn-left">←</button>
    <button id="btn-right">→</button>
    <button id="btn-interact">Interact</button>
    <button id="btn-store" class="secondary">Store</button>
  </div>
  <div id="store-modal">
    <div id="store-box">
      <h3>KLONE Tools</h3>
      <div id="store-items"></div>
      <button id="store-close" class="secondary">Close</button>
    </div>
  </div>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
  </script>
</body>
</html>
