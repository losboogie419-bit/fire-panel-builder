<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fake It To You Make It</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #140A26;
      --card: #24143F;
      --selected: #3B1F66;
      --accent: #38E1F5;
      --text: #FFFFFF;
      --label: #D8B4FE;
      --muted: #7A6A99;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; touch-action: none; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    header { background: var(--card); padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    canvas { display: block; background: #1a0e30; width: 100%; height: 100%; }
    .panel { background: var(--card); border-left: 4px solid transparent; padding: 10px; margin: 6px; border-radius: 8px; }
    .panel.selected { border-left-color: var(--accent); background: var(--selected); }
    button { background: var(--accent); color: #140A26; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; min-height: 44px; margin: 4px; }
    button.secondary { background: var(--muted); color: white; }
    #status { font-size: 14px; color: var(--label); }
    #credits { color: var(--accent); font-weight: bold; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div id="status">Fake It To You Make It</div>
      <div>Credits: <span id="credits">0</span></div>
    </header>
    <div id="canvas-wrap">
      <canvas id="game"></canvas>
    </div>
    <div id="ui" style="padding: 8px; background: var(--card);">
      <button id="btn-wire">Wire</button>
      <button id="btn-meter">Meter</button>
      <button id="btn-test">Test Circuit</button>
      <button id="btn-next" class="secondary">Next Floor</button>
    </div>
  </div>
  <script src="js/progress.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/wiring.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
